
[package]
name = "gdutils"
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "Geometry Dash, AREDL (and in the future more) APIs crate! (WIP, please contribute!)"
homepage = "https://codeberg.org/JuxGD/gdutils-rs"
repository = "https://github.com/JuxGD/gdutils-rs"

[dependencies]
reqwest = { version = "0.13.4", features = ["form"]}
rand = "0.10.1"
xor_cryptor_keylen = "2.0.4"
base64 = "0.22.1"
rust-string-random = "0.1.0"
colonparse = "0.1.3"
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
simple-datetime-rs = { version = "0.3.0", features = ["serde"] }
derive_builder = "0.20.2"
eyre = "0.6.12"
