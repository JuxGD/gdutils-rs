
[package]
name = "gdutils"
version = "0.5.0"
edition = "2024"
license = "MIT"
description = "Geometry Dash, AREDL (and in the future more) APIs crate! (WIP, please contribute!)"
homepage = "https://codeberg.org/JuxGD/gdutils-rs"
repository = "https://github.com/JuxGD/gdutils-rs"

[dependencies]
reqwest = { version = "0.13.5", features = ["form", "query"]}
rand = "0.10.3"
xor_cryptor = "2.0.5"
xor_cryptor_keylen = "2.0.4"
base64 = "0.23.1"
colonparse = "0.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
derive_builder = "0.20.2"
eyre = "0.6.14"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full"] }
